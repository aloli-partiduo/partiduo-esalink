      forbidden: "Guardar o desconectar la conexión exige también el permiso de configurar la facturación electrónica."
    deviations:
      title: "Desviaciones observadas respecto a la norma XP Z12-013"
      help: "La API de EsaLink sigue la API Flux de la norma; el adaptador gestiona estas desviaciones."
    actions:
      connect: "Probar y conectar"
      check: "Probar la conexión"
      disconnect: "Desconectar"
    flash:
      connected: "EsaLink está conectado (%{mode})."
      checked: "EsaLink responde (%{mode}, %{url})."
      disconnected: "EsaLink está desconectado."
