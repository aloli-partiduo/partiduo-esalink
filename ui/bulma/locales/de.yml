      title: "Anbinden"
      change: "Anbindung ändern"
      help: "Geben Sie Kennung und Passwort Ihres EsaLink-Zugangs ein (von EsaLink oder einem Vertriebspartner aus PDP Libre bereitgestellt). Sie werden bei EsaLink getestet, bevor sie gespeichert werden."
      secret_stored: "Gespeichert — leer lassen, um es zu behalten"
